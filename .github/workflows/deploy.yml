name: Deploy site

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 문서의 최종 수정일을 git 이력에서 읽기 위해 필요합니다.

      # Pages 설정을 읽어 사이트 주소 등을 단계 출력으로 넘깁니다.
      #
      # enablement: true 로 Pages 자체를 켜는 것은 불가능합니다. 사이트 생성은
      # 저장소 관리자 권한을 요구하는데 워크플로우 토큰에는 그 권한을 줄 수
      # 없어서 "Resource not accessible by integration" 으로 실패합니다.
      # Pages 활성화는 저장소 설정이나 REST API로 한 번만 해 두면 됩니다.
      - uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: mkdocs build --strict --verbose

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
